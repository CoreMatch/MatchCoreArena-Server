# MatchCoreArena-Server 应用配置模板
# 复制为 config.yaml 后按需修改；版本变更由 config 包自动迁移。

version: "1.0.0"

server:
  host: "0.0.0.0"
  port: 9178
  read_timeout_seconds: 15
  write_timeout_seconds: 15

database:
  host: "localhost"
  port: 3306
  user: "root"
  password: ""           # 生产环境请使用环境变量覆盖
  name: "matchcorearena"
  max_open_conns: 50
  max_idle_conns: 10

redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0

migrate:
  # 存放 migrations 目录的相对路径
  path: "migrations"
